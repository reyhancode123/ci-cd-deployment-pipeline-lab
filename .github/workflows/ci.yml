name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Ruff
        run: ruff check app tests

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t cicd-pipeline-lab:test .
      - name: Run container integration tests
        run: |
          docker run -d --name cicd-pipeline-test -p 127.0.0.1:18000:8000 cicd-pipeline-lab:test
          for attempt in {1..10}; do
            if curl -fsS http://127.0.0.1:18000/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18000/health
          test "$(docker exec cicd-pipeline-test id -u)" = "10001"
      - name: Clean up test container
        if: always()
        run: docker rm -f cicd-pipeline-test || true
