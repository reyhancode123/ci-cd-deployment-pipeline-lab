services:
  app:
    build: .
    image: cicd-pipeline-lab:1.0.0
    container_name: cicd-pipeline-app
    ports:
      - "127.0.0.1:18002:8000"
    environment:
      APP_VERSION: "1.0.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
